name: CI

# Runs on every push, and on every pull request aimed at main.
on:
  push:
  pull_request:
    branches: [main]

jobs:
  # ---------------------------------------------------------------------
  # Job 1: do the tests pass?
  # No database, no RabbitMQ, no S3 -- the tests use SQLite, so this runs
  # in seconds and costs nothing.
  # ---------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    steps:
      # checkout MUST come first. A local composite action lives in this
      # repo, so the runner cannot find ./.github/actions/... until the
      # repo is on disk. This trips up everyone once.
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-python-app

      - name: Run tests
        working-directory: backend
        run: python -m pytest

  # Second caller of the same composite. This is the whole point: the
  # setup steps are written once and used twice.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-python-app

      - name: Check style and common mistakes
        run: ruff check .

  # ---------------------------------------------------------------------
  # Job 2: does the image still build?
  # Tests can pass while the Dockerfile is broken. Catch that here, before
  # you find out during a deploy. Nothing is pushed anywhere yet -- that
  # comes in stage 3.
  # ---------------------------------------------------------------------
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: report-builder:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------
  # Job 3: integration tests.
  # Starts the ENTIRE system with docker compose -- real Postgres, real
  # RabbitMQ, real object storage -- then runs tests against it. This is the
  # same docker-compose.yml you use on your laptop. No separate CI setup to
  # maintain, and no "it worked locally" surprises.
  # ---------------------------------------------------------------------
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start the whole system
        run: |
          cp .env.example .env
          docker compose up -d --build

      - name: Wait for the API to answer
        run: |
          for _ in $(seq 1 40); do
            curl -sf http://localhost:8000/health && exit 0
            sleep 3
          done
          echo "API never became healthy"; exit 1

      - name: Run integration tests
        # S3_PUBLIC_ENDPOINT is overridden because these tests run INSIDE the
        # docker network, where "localhost" means the container itself.
        run: |
          docker compose run --rm -e S3_PUBLIC_ENDPOINT=http://minio:9000 \
            api python -m pytest tests_integration

      - name: Show logs if something failed
        if: failure()
        run: docker compose logs --tail=100
